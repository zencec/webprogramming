<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Registration Form</title>
<style>
h1{
color:red;
text-align:center;
}
body{
background-color:lightblue;
}
</style>
</head>
<body >

   <h1>Student Registration Form</h1>
<form>
<label>Name:</label> 
<input type="text" >
<br><br>
<label>Phone:</label> 
<input type="tel" 
      id="phone"
      name="Phone" 
      placeholder="+1 (123) 456-7890" 
      maxlength="10" 
      pattern="^(\+?\d{1,3})?[-.\s]?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}$"
      title="Please enter a valid phone number. Allowed symbols: +, -, (, ), spaces, and dots."
      oninput="this.value = this.value.replace(/[^1-9]/g, '')"
      required>
<br><br>
<label>Select Your Gender:</label>

<input type="radio" name = "male" value="male">
<label>Male</label>
<input type="radio" name = "female" value="female">
<label>Female</label>
<input type="radio" name = "Other" value="Other">
<label>Other</label>
<br><br>
<label> Choose your Qualification:</label>
<select name="Qualification" >
<option value = "">-- Select --</option>
<option value = "SSLC">SSLC</option>
<option value = "plus two">Plus two</option>
<option value = "degree">degree</option>
</select>
<br><br>
<label>Date Of Transfer </label> 
<input type="date" name = "date">
<br><br>
<label> Course Selection</label>
<select name="course">
<option value = "">-- Select --</option>
<option value = "SSLC">MCA</option>
<option value = "plus two">BCA</option>
<option value = "degree">BTECH</option></select>
<br><br>
<label >Address:</label>
<br>
<textarea rows = "5" cols="15">
</textarea>
<br>
<label >File upload: </label><input type = "file">
<br><br>
<label>Email:</label> 
<input type="email" name = "Phone">
<br><br>
<label>Password:</label> 
<input  type="password" 
      id="password"
      name="Password" 
      placeholder="••••••••••••" 
      minlength="8"
      maxlength="32" 
      pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,32}$"
      title="Password must be 8-32 characters long and include at least: one uppercase letter, one lowercase letter, one number, and one special character (@$!%*?&)."
      required
     ><br><br>
<label>Confirm Password:</label> 
<input type="password" name = "Phone">
<br><br>
<input type="submit" value="submit">
<input type="reset" value="clear">
</form>
</body>
</html>
