<html>
<body>
<script>
document.write("Square Root: " + Math.sqrt(25) + "<br>");
document.write("Power: " + Math.pow(2,3) + "<br>");
document.write("Absolute: " + Math.abs(-16) + "<br>");
document.write("Random: " + Math.random() + "<br>");
document.write("Round: " + Math.round(4.7) + "<br>");
document.write("Ceil: " + Math.ceil(4.2) + "<br>");
document.write("Floor: " + Math.floor(4.8) + "<br>");
document.write("Maximum: " + Math.max(10,25,15) + "<br>");
document.write("Minimum: " + Math.min(10,25,15) + "<br>");
document.write("Trunc: " + Math.trunc(12.89));
</script>
</body>
</html>
